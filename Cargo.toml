[package]
name = "intear-events"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# The `intear-events` binary: the HTTP and WebSocket servers and the Redis to Postgres module
server = [
    "dep:inevents",
    "dep:dotenvy",
    "dep:log",
    "dep:simple_logger",
    "dep:futures",
    "dep:tokio",
]

[[bin]]
name = "intear-events"
path = "src/main.rs"
required-features = ["server"]

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
schemars = "0.8.21"
chrono = { version = "0.4.38", features = ["serde"] }
bigdecimal = "0.4"
inindexer = "8.0.0"

inevents = { git = "https://github.com/INTEARnear/inevents", optional = true }
dotenvy = { version = "0.15.7", optional = true }
log = { version = "0.4.21", optional = true }
simple_logger = { version = "5.0.0", optional = true }
futures = { version = "0.3.30", optional = true }
tokio = { version = "1.40.0", features = ["rt-multi-thread", "macros"], optional = true }
